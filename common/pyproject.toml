[project]
name = "ohmypm-common"
version = "0.1.0"
description = "ohmypm shared library: PROJECT_ID discovery, enums, protocol models, HTTP client"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ohmypm_common"]
