[project]
name = "ohmypm-runner"
version = "0.1.0"
description = "ohmypm Agent Runner: runs agent CLIs on the host for tasks dispatched by the backend"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "ohmypm-common",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[tool.uv.sources]
ohmypm-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ohmypm_runner"]
