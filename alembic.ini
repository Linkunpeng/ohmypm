# Developer convenience for running Alembic by hand (e.g. `uv run alembic revision -m ...`
# against ./dev.db). ohmypm itself migrates automatically on first use
# (see src/ohmypm/storage/database.py).
[alembic]
script_location = src/ohmypm/storage/migrations
sqlalchemy.url = sqlite:///%(here)s/dev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
