[project]
name = "ohmypm-cli"
version = "0.1.0"
description = "ohmypm command line: projects, tasks, context, agents, runner"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "ohmypm-common",
    "ohmypm-runner",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
]

[project.scripts]
ohmypm = "ohmypm_cli.main:app"

[tool.uv.sources]
ohmypm-common = { workspace = true }
ohmypm-runner = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ohmypm_cli"]
