[project]
name = "ohmypm-server"
version = "0.1.0"
description = "ohmypm backend: REST API, MCP server, application services, PostgreSQL storage"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "ohmypm-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "fastmcp>=2.13",
]

[project.scripts]
ohmypm-server = "ohmypm.main:run"

[tool.uv.sources]
ohmypm-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ohmypm"]
