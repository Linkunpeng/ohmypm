# docker compose up -d   → PostgreSQL + ohmypm server (REST, MCP at /mcp, Web UI at /)
# Then on the host:        ohmypm runner start --allowed-root ~/workspace
name: ohmypm

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ohmypm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (scripts/init-env.sh)}
      POSTGRES_DB: ${POSTGRES_DB:-ohmypm}
    volumes:
      - pgdata:/var/lib/postgresql
    # Bound to localhost only (never expose PostgreSQL publicly). Used for host-side tooling/tests.
    ports:
      - "127.0.0.1:${OHMYPM_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      args:
        PYPI_MIRROR: ${PYPI_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: ohmypm-server:latest
    restart: unless-stopped
    env_file: .env
    environment:
      OHMYPM_HOST: 0.0.0.0
      OHMYPM_PORT: "8765"
      OHMYPM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ohmypm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ohmypm}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${OHMYPM_HOST_PORT:-8765}:8765"

volumes:
  pgdata:
